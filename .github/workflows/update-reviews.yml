name: Update Google Reviews

# Scheduled runs turned off 2026-09-07 (owner request).
# src/data/reviews.json now stays frozen at whatever the last run wrote;
# run this workflow manually from the Actions tab to refresh it.
on:
  workflow_dispatch: {} # manual run only

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/fetch-reviews.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/reviews.json; then
            echo "No review changes."
            exit 0
          fi
          git add src/data/reviews.json
          git commit -m "chore: refresh Google reviews [skip ci]"
          git push
